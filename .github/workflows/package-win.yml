name: Rethos Windows installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the selected branch)"
        required: false
        type: string
      publish:
        description: "Publish the verified Windows assets to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rethos-windows-release
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Pin the source
        id: source
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT
          $taskTemp = Join-Path $env:GITHUB_WORKSPACE '.Rethos-temp/desktop-release/runtime'
          New-Item -ItemType Directory -Force $taskTemp | Out-Null
          "TEMP=$taskTemp" >> $env:GITHUB_ENV
          "TMP=$taskTemp" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/windows-release.test.mjs
      - run: pnpm exec vitest run server/request-auth.test.ts server/live-access.test.ts
      - run: node --test electron/server-session.node-test.mjs electron/desktop-server-auth.node-test.mjs electron/startup-tray.node-test.mjs electron/native-language.node-test.mjs electron/self-hosted.node-test.mjs electron/cloud-entry.node-test.mjs electron/company-backup-main.node-test.mjs
      - name: Clean build outputs
        run: pnpm clean
      - run: pnpm package:win
      - name: Verify the bundled browser with an empty home
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: Verify the packaged server and browser discovery
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Verify module scopes
        run: node scripts/check-module-scopes.mjs release/win-unpacked/resources
      - name: Install and launch the packaged desktop in an isolated fixture
        run: node scripts/smoke-windows-installer.mjs
      - name: Verify update metadata and assemble release assets
        run: node scripts/windows-release.mjs
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rethos-windows-diagnostics
          path: |
            .Rethos-temp/desktop-release/**/*.log
            .Rethos-temp/desktop-release/**/renderer.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rethos-windows-${{ steps.source.outputs.version }}-x64
          path: release/windows-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish verified Windows release
    needs: package
    if: inputs.publish && github.repository == 'Hopesy/Rethos'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rethos-windows-${{ needs.package.outputs.version }}-x64
          path: release/windows-assets
      - name: Publish and verify uploaded hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.package.outputs.sha }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: node scripts/publish-windows-release.mjs
