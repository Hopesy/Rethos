name: Rethos Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to build
        required: false
        type: string
      publish:
        description: Publish the verified signed APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rethos-android-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android client
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, lint and test
        run: bash android/gradlew -p android assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify isolated WebView on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/gradlew -p android connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          retention-days: 14

  package:
    name: Sign and package Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed release
        env:
          RETHOS_ANDROID_KEYSTORE_BASE64: ${{ secrets.RETHOS_ANDROID_KEYSTORE_BASE64 }}
          RETHOS_ANDROID_STORE_PASSWORD: ${{ secrets.RETHOS_ANDROID_STORE_PASSWORD }}
          RETHOS_ANDROID_KEY_ALIAS: ${{ secrets.RETHOS_ANDROID_KEY_ALIAS }}
          RETHOS_ANDROID_KEY_PASSWORD: ${{ secrets.RETHOS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$RETHOS_ANDROID_KEYSTORE_BASE64"
          umask 077
          mkdir -p .Rethos-temp/android-signing
          export RETHOS_ANDROID_KEYSTORE="$PWD/.Rethos-temp/android-signing/release.p12"
          trap 'rm -f "$RETHOS_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$RETHOS_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RETHOS_ANDROID_KEYSTORE"
          bash android/gradlew -p android assembleRelease lintRelease --console=plain
      - name: Verify signature and assemble release files
        id: package
        run: |
          mkdir -p release/android-assets
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > release/android-assets/SIGNATURE.txt
          node android/scripts/release.mjs prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rethos-android-release
          path: release/android-assets/
          retention-days: 30

  publish:
    name: Publish Android release
    needs: [verify, package]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rethos-android-release
          path: release/android-assets
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: node android/scripts/release.mjs publish
