name: Rethos Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - deploy/**
      - server/**
      - shared/**
      - src/**
      - public/**
      - skills/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vite.config.*
      - index.html
      - LICENSE
      - NOTICE
      - LICENSING.md
      - third_party/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - deploy/**
      - scripts/smoke-docker.sh
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: rethos-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/hopesy/rethos

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      chrome: ${{ steps.keys.outputs.chrome }}
      chromium: ${{ steps.keys.outputs.chromium }}
      engines: ${{ steps.keys.outputs.engines }}
      engines_tag: ${{ steps.keys.outputs.engines_tag }}
    steps:
      - id: keys
        env:
          ENGINE_PACKAGES: "@anthropic-ai/claude-code @openai/codex"
        run: |
          today="date-$(date -u +%F)"
          chrome=$(curl -fsSL --max-time 30 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -er .channels.Stable.version) || chrome=""
          [[ "$chrome" =~ ^[0-9]+(\.[0-9]+)+$ ]] || chrome=$today
          chromium=$(curl -fsSL --max-time 30 'https://qa.debian.org/madison.php?package=chromium&s=bookworm,bookworm-security&a=arm64&text=on' | awk -F'|' '{gsub(/ /, "", $2); print $2}' | sort -V | tail -n 1) || chromium=""
          [[ "$chromium" =~ ^[0-9][0-9A-Za-z.+~:-]*$ ]] || chromium=$today
          engines="" engines_tag=""
          for package in $ENGINE_PACKAGES; do
            version=$(npm view "$package@latest" version 2>/dev/null) || version=""
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9][0-9A-Za-z.+-]*$ ]]; then engines=$ENGINE_PACKAGES engines_tag=$today; break; fi
            engines="$engines $package@$version"
          done
          { echo "chrome=$chrome"; echo "chromium=$chromium"; echo "engines=${engines# }"; echo "engines_tag=$engines_tag"; } | tee -a "$GITHUB_OUTPUT"

  build-and-smoke:
    needs: prepare
    name: Build and verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: rethos:ci
          labels: |
            org.opencontainers.image.title=Rethos
            org.opencontainers.image.source=https://github.com/Hopesy/Rethos
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            CHROME_CACHE_TAG=${{ needs.prepare.outputs.chrome }}
            CHROMIUM_CACHE_TAG=${{ needs.prepare.outputs.chromium }}
            ENGINES=${{ needs.prepare.outputs.engines }}
            ENGINES_CACHE_TAG=${{ needs.prepare.outputs.engines_tag }}
          cache-from: type=gha,scope=rethos-${{ matrix.arch }}
          cache-to: type=gha,scope=rethos-${{ matrix.arch }},mode=max
      - name: Verify boot, OSS, browser, HTTPS pairing and persistent data
        run: bash scripts/smoke-docker.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.repository == 'Hopesy/Rethos' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the verified image
        if: github.event_name != 'pull_request' && github.repository == 'Hopesy/Rethos' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag rethos:ci "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    needs: build-and-smoke
    if: github.event_name != 'pull_request' && github.repository == 'Hopesy/Rethos' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform manifest
        run: |
          tags=(--tag "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(--tag "$IMAGE:latest"); fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(--tag "$IMAGE:$GITHUB_REF_NAME"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
